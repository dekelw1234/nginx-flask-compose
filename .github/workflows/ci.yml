name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Validate nginx config
        run: docker compose exec -T web nginx -t

      - name: "Smoke test: /health returns 200"
        run: curl -fsS http://localhost:8080/health

      - name: "Smoke test: home page returns 200"
        run: curl -fsS -o /dev/null http://localhost:8080/

      - name: "Smoke test: unknown page returns 404"
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist)
          echo "Got HTTP $code"
          test "$code" = "404"

      - name: "Smoke test: API goes through nginx to the backend"
        run: |
          curl -fsS http://localhost:8080/api/hello | tee response.json
          grep -q "Hello from the backend" response.json

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Save the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose config --images | tee images.txt
          docker save $(cat images.txt) | gzip > images.tar.gz
          ls -lh images.tar.gz

      - name: Upload the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-images
          path: |
            images.tar.gz
            images.txt
          retention-days: 1

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the tested images
        uses: actions/download-artifact@v4
        with:
          name: tested-images

      - name: Load images into Docker
        run: gunzip -c images.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::7}"
          while read -r image; do
            name="${image%%:*}"
            target="ghcr.io/${owner}/${name}"
            docker tag "$image" "${target}:${short_sha}"
            docker tag "$image" "${target}:main"
            docker push "${target}:${short_sha}"
            docker push "${target}:main"
            echo "Published ${target}:${short_sha}"
          done < images.txt

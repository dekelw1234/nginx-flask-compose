services:
  web:
    build: .
    image: my-nginx:5.0
    container_name: my-nginx
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    image: backend:1.0
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
